name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only the newest push to a branch is worth a runner; earlier ones are already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the `engines.node` floor in package.json.
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Builds protocol and core on the way through, so no separate build step.
      - run: npm test
